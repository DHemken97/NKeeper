# NKeeper in the frontend container: serves the built SPA and proxies /api to the backend
# container, so the browser only ever talks to one origin (no CORS, SameSite=Strict cookies work).
# Port 8080 is plain HTTP (for http://localhost); HTTPS on 8443 and the HTTP->HTTPS redirect on
# 8081 are generated at startup by nkeeper-tls.sh (conf.d/tls.conf).

include snippets/nkeeper/maps.conf;

# "backend" is the Compose service name, resolved inside the Docker network only.
upstream nkeeper_api {
    server backend:8080;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;
    include snippets/nkeeper/app-locations.conf;
}

# Web session origins (see snippets/web-session-locations.conf).
server {
    listen 8080;
    # Quoted: unquoted braces would end the directive.
    server_name "~^nkw-[0-9a-f]{32}\.";
    server_tokens off;
    client_max_body_size 1g;
    include snippets/nkeeper/web-session-locations.conf;
}
