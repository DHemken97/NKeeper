# Serves the built SPA and proxies /api to the backend container, so the browser
# only ever talks to one origin (no CORS, SameSite=Strict cookies just work).

# Behind an outer TLS-terminating proxy, keep the protocol it reports; otherwise use ours.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    # Terminal sessions: WebSocket upgrade, and no 60s idle cut-off (the API pings every 30s).
    # $http_host keeps the browser's port so the API can verify the Origin exactly.
    location /api/ssh/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/ {
        # "backend" is the Compose service name, resolved inside the Docker network only.
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed build assets never change: cache aggressively.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Client-side routes fall back to index.html, which must always be revalidated.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
