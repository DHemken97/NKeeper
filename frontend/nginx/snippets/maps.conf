# http-level variables used by NKeeper's servers (prefixed so they never clash with other sites' maps).

# Behind an outer TLS-terminating proxy, keep the protocol it reports; otherwise use ours.
map $http_x_forwarded_proto $nkeeper_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $nkeeper_connection_upgrade {
    default upgrade;
    ''      '';
}
