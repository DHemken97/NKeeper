# Web sessions (HTTP/HTTPS connections to hosts): each runs on its own origin, nkw-<id>.<domain>,
# and everything on it goes to the API, which makes the request to the host and relays the answer.
# NKeeper's security headers are not added: the proxied app sends its own.
location / {
    proxy_pass http://nkeeper_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $nkeeper_connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $nkeeper_forwarded_proto;
    # Stream both ways (downloads, uploads, server-sent events, consoles).
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
