# NKeeper's own site: the built SPA plus /api proxied to the API (upstream "nkeeper_api").
# Included by every server that serves NKeeper (HTTP in the container, HTTPS everywhere).
# Needs the http-level maps in maps.conf.

# Remote sessions (SSH, RDP, RPC, VNC, SPICE): WebSocket upgrade, and no 60s idle cut-off (the API pings
# every 30s). $http_host keeps the browser's port so the API can verify the Origin exactly.
location ~ ^/api/(ssh|rdp|rpc|vnc|spice)/ {
    proxy_pass http://nkeeper_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $nkeeper_forwarded_proto;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    include snippets/nkeeper/security-headers.conf;
}

# mRemoteNG imports carry the whole connection file (the API accepts up to 40 MB here); every
# other API request stays under the server's 1 MB limit.
location = /api/hosts/import {
    client_max_body_size 40m;
    proxy_pass http://nkeeper_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $nkeeper_forwarded_proto;
    proxy_read_timeout 5m;
    include snippets/nkeeper/security-headers.conf;
}

# Moving an instance: imports upload the whole encrypted export (the API accepts up to 256 MB), and
# exports and imports take a while (key derivation, one transaction for everything).
location ^~ /api/admin/transfer/ {
    client_max_body_size 260m;
    proxy_pass http://nkeeper_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $nkeeper_forwarded_proto;
    proxy_request_buffering off;
    proxy_read_timeout 10m;
    proxy_send_timeout 10m;
    include snippets/nkeeper/security-headers.conf;
}

location /api/ {
    proxy_pass http://nkeeper_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $nkeeper_forwarded_proto;
    proxy_read_timeout 60s;
    include snippets/nkeeper/security-headers.conf;
}

# Hashed build assets never change: cache aggressively.
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include snippets/nkeeper/security-headers.conf;
}

# Client-side routes fall back to index.html, which must always be revalidated.
location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include snippets/nkeeper/security-headers.conf;
}
