; Runs NKeeper's four services in the single image, restarting any that stop. Logs go to the
; container's output. Stopping the container stops them in reverse order (nginx first).
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; Unix socket only: nothing outside the container can reach the database.
[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D /var/lib/nkeeper/postgres -c listen_addresses= -c unix_socket_directories=/run/postgresql
user=postgres
priority=10
stopsignal=INT
stopwaitsecs=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; guacd has no authentication, so it listens on loopback only.
[program:guacd]
command=/opt/guacamole/sbin/guacd -f -b 127.0.0.1 -l 4822 -L info
user=guacd
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=/usr/local/bin/nkeeper-api
user=nkeeper
directory=/opt/nkeeper/api
priority=30
startsecs=10
startretries=20
stopwaitsecs=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off; error_log stderr;"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
