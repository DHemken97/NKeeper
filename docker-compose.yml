# NKeeper: full stack (PostgreSQL + API + guacd + web frontend).
#   scripts/setup.sh (Linux) or scripts/setup.ps1 (Windows) writes .env and starts it; or by hand:
#   cp .env.example .env   # then set POSTGRES_PASSWORD
#   docker compose up -d --build
# The app is served on http://localhost:${NKEEPER_HTTP_PORT:-8080} and https://<name>:${NKEEPER_HTTPS_PORT:-8443}.
# Only the frontend publishes ports; PostgreSQL, the API and guacd are reachable solely on the
# internal Compose network.
name: nkeeper

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nkeeper}
      POSTGRES_USER: ${POSTGRES_USER:-nkeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # Apache Guacamole's connection daemon: the API hands it RDP sessions (with pinned
  # certificates) and relays the result to the browser. It has no authentication of its own,
  # so it must never be published or reachable by anything but the API.
  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  backend:
    build:
      context: ./backend
    image: nkeeper-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # "postgres" is the service name; never localhost inside a container.
      ConnectionStrings__NKeeper: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-nkeeper};Username=${POSTGRES_USER:-nkeeper};Password=${POSTGRES_PASSWORD}"
      Database__MigrateOnStartup: ${NKEEPER_MIGRATE_ON_STARTUP:-true}
      Authentication__RequireSecureCookies: ${NKEEPER_REQUIRE_SECURE_COOKIES:-true}
      Guacd__Host: guacd
      Guacd__Port: "4822"
      # The API is only reachable through the frontend's nginx, so its forwarded headers can be trusted.
      ForwardedHeaders__Enabled: "true"
      WebProxy__BaseDomain: ${NKEEPER_WEB_BASE_DOMAIN:-}
      BootstrapAdmin__Enabled: ${NKEEPER_BOOTSTRAP_ADMIN_ENABLED:-false}
      BootstrapAdmin__AllowOutsideDevelopment: ${NKEEPER_BOOTSTRAP_ADMIN_ALLOW_OUTSIDE_DEVELOPMENT:-false}
      BootstrapAdmin__UserName: ${NKEEPER_BOOTSTRAP_ADMIN_USERNAME:-}
      BootstrapAdmin__Email: ${NKEEPER_BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${NKEEPER_BOOTSTRAP_ADMIN_PASSWORD:-}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: nkeeper-frontend:local
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Names and addresses clients use to open NKeeper; the HTTPS certificate covers them.
      NKEEPER_SERVER_NAMES: ${NKEEPER_SERVER_NAMES:-localhost}
      NKEEPER_WEB_BASE_DOMAIN: ${NKEEPER_WEB_BASE_DOMAIN:-}
      NKEEPER_HTTPS_PORT: ${NKEEPER_HTTPS_PORT:-8443}
    volumes:
      - tls:/etc/nginx/tls
    ports:
      - "${NKEEPER_HTTP_BIND:-127.0.0.1}:${NKEEPER_HTTP_PORT:-8080}:8080"
      - "${NKEEPER_HTTPS_BIND:-127.0.0.1}:${NKEEPER_HTTPS_PORT:-8443}:8443"
      # Plain HTTP that redirects to HTTPS (e.g. port 80 on a server).
      - "${NKEEPER_HTTPS_BIND:-127.0.0.1}:${NKEEPER_HTTP_REDIRECT_PORT:-8081}:8081"

volumes:
  postgres-data:
  # HTTPS certificate: NKeeper's private CA and server certificate, or your own (custom.crt/.key).
  tls:
