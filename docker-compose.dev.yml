# Local development: run PostgreSQL and guacd in Docker and expose them on the loopback
# interface, so the API (dotnet run) and frontend (npm run dev) can run directly on the host.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres guacd
services:
  guacd:
    ports:
      - "127.0.0.1:${GUACD_DEV_PORT:-4822}:4822"
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_DEV_PORT:-5432}:5432"
